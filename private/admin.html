<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Dragon Queue</title>
    <link rel="stylesheet" href="/adminPageStyle.css?v=3">
</head>

<body>
    <div class="admin-shell">
        <header class="admin-header">
            <div class="brand-block">
                <img src="/IMG/Bethune Logo-PLACEHOLDER.png" alt="Bethune logo" class="brand-logo">
                <div>
                    <p class="eyebrow">DRAGON QUEUE</p>
                    <h1>Admin Dashboard</h1>
                </div>
            </div>

            <div class="admin-header-actions">
                <div class="admin-identity">
                    <strong id="admin-name">Loading...</strong>
                    <span id="admin-role">Administrator</span>
                </div>
                <a class="secondary-button" href="/main.html">Student Dashboard</a>
                <button class="primary-button" type="button" id="logout-btn">Logout</button>
            </div>
        </header>

        <main>
            <section class="overview-bar" aria-label="Admin dashboard status">
                <div>
                    <p class="eyebrow">TESTING READ ONLY</p>
                    <h2>Live station overview</h2>
                    <p>Watch active games, confirmation timers and queues.</p>
                </div>

                <div class="refresh-area">
                    <span id="last-updated">Waiting for first update...</span>
                    <button class="secondary-button" type="button" id="refresh-btn">Refresh now</button>
                </div>
            </section>

            <div id="dashboard-error" class="error-banner" role="alert" hidden></div>

            <section id="station-grid" class="station-grid" aria-live="polite">
                <article class="loading-card">
                    <strong>Loading Dragon Queue...</strong>
                    <p>Fetching the live station state.</p>
                </article>
            </section>
        </main>
    </div>

    <script src="/adminPageScript.js?v=3"></script>
</body>

</html>
