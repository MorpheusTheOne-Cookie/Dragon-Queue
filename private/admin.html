<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Dragon Queue</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #eef3f9;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .admin-card {
            width: min(560px, 100%);
            background: white;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-bottom: 10px;
            color: #167fc1;
        }

        .status {
            margin: 20px 0;
            padding: 16px;
            border-radius: 12px;
            background: #edf8f1;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        button,
        a {
            border: 0;
            border-radius: 10px;
            padding: 12px 18px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        a {
            color: #167fc1;
            border: 1px solid #167fc1;
        }

        button {
            background: #167fc1;
            color: white;
        }
    </style>
</head>

<body>
    <main class="admin-card">
        <h1>Dragon Queue Admin</h1>
        <p>This is the protected admin area.</p>

        <div class="status">
            <strong>Access confirmed</strong>
            <p id="admin-info">Checking administrator session...</p>
        </div>

        <p>
            The real Admin Dashboard will be built in Goal 3. For Goal 2, this page exists so we can prove that only authorized administrators can reach it.
        </p>

        <div class="actions">
            <a href="/main.html">Student Dashboard</a>
            <button type="button" id="logout-btn">Logout</button>
        </div>
    </main>

    <script>
        const adminInfo = document.getElementById("admin-info");
        const logoutButton = document.getElementById("logout-btn");

        async function checkAdmin() {
            try {
                const response = await fetch("/api/admin/me");

                if (!response.ok) {
                    window.location.href = "/admin-login.html";
                    return;
                }

                const user = await response.json();
                adminInfo.textContent = user.username + " • " + user.role;

            } catch (error) {
                console.error("Admin session check failed:", error);
                window.location.href = "/admin-login.html";
            }
        }

        logoutButton.addEventListener("click", async function () {
            await fetch("/api/logout", { method: "POST" });
            localStorage.removeItem("dragon-user");
            window.location.href = "/admin-login.html";
        });

        checkAdmin();
    </script>
</body>

</html>
