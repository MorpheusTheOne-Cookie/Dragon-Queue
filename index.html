<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Dragon Queue</title>
    <link rel="stylesheet" href="registerStyle.css">
    <script src="https://kit.fontawesome.com/61b297af10.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="container">
        <div class="form-box">

            <img src="images/dragon-logo.png" alt="Dragon Queue logo">
            <h1 id="title">Register</h1>

            <form>
                <div class="input-group">

                    <div class="input-field" id="username-field">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="Username" required>
                    </div>

                    <div class="input-field">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Email" required>
                    </div>

                    <div class="input-field">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="password" name="password" placeholder="Password" required>
                    </div>

                    <div class="input-field" id="confirm-password-field">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="confirm-password" name="confirm-password"
                            placeholder="Confirm Password" required>
                    </div>

                    <p id="ForgotPassword" class="hidden"><a href="#">Forgot Password</a></p>

                </div>

                <div class="btn-field">
                    <button type="button" id="sign-up-btn">Register</button>
                    <button type="button" id="sign-in-btn" class="disable">Login</button>
                    <button type="button" id="main-page-btn" class="submit-btn">Main Page</button>
                </div>

                <p class="message" id="message"></p>

            </form>
        </div>
    </div>

    <script>
        // Find every part of the page that the code needs to change.
        let signUpBtn = document.getElementById("sign-up-btn");
        let signInBtn = document.getElementById("sign-in-btn");
        let usernameField = document.getElementById("username-field");
        let confirmPasswordField = document.getElementById("confirm-password-field");
        let title = document.getElementById("title");
        let forgotPassword = document.getElementById("ForgotPassword");
        let mainPageBtn = document.getElementById("main-page-btn");
        let message = document.getElementById("message");

        // Remembers which mode we are in: "register" or "login".
        let mode = "register";

        // Switch the card into Login mode: hide the two extra rows.
        signInBtn.onclick = function () {
            mode = "login";
            usernameField.style.maxHeight = "0";
            confirmPasswordField.style.maxHeight = "0";
            forgotPassword.style.display = "block";
            title.innerHTML = "Login";
            signUpBtn.classList.add("disable");
            signInBtn.classList.remove("disable");
        }

        // Switch the card back into Register mode: show the rows again.
        signUpBtn.onclick = function () {
            mode = "register";
            usernameField.style.maxHeight = "65px";
            confirmPasswordField.style.maxHeight = "65px";
            forgotPassword.style.display = "none";
            title.innerHTML = "Register";
            signUpBtn.classList.remove("disable");
            signInBtn.classList.add("disable");
        }

        // The big button: check the form, save the user, then open the dashboard.
        mainPageBtn.onclick = async function () {
            // Read what the person typed into the boxes.
            let username = document.getElementById("username").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirm-password").value;

            // In login mode there is no username box, so use the email instead.
            if (mode === "login" && username === "") {
                username = email.split("@")[0];
            }

            // Simple checks before we let anyone through.
            if (email === "" || password === "") {
                message.innerHTML = "Please fill in your email and password.";
                return;
            }

            if (mode === "register" && username === "") {
                message.innerHTML = "Please choose a username.";
                return;
            }

            if (mode === "register" && password !== confirmPassword) {
                message.innerHTML = "The two passwords are not the same.";
                return;
            }

            // Ask the Node server to create or find this user.
            let user = await postJson("/api/login", { username: username, email: email });

            // If the server is not running, make a temporary user in the browser.
            if (user === null) {
                user = { id: 1, username: username, title: "Student" };
            }

            // Save the user so the other pages know who is signed in.
            localStorage.setItem("dragon-user", JSON.stringify(user));

            // Go to the dashboard.
            window.location.href = "main.html";
        }

        // Send some data to the server and give back its answer (or null).
        async function postJson(path, body) {
            try {
                const response = await fetch(path, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                });
                return await response.json();
            } catch (error) {
                return null;
            }
        }
    </script>

</body>

</html>
